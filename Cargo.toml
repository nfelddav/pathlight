[workspace]
resolver = "3"
members = ["crates/pathlight", "crates/pathlight-capi", "crates/pathlight-py"]
# The Python crate needs maturin to produce a usable module, so plain
# `cargo build` / `cargo test` skip it.
default-members = ["crates/pathlight", "crates/pathlight-capi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nfelddav/pathlight"

[workspace.dependencies]
pathlight = { path = "crates/pathlight" }

[profile.release]
lto = "thin"
codegen-units = 1
