language = "C"
include_guard = "PATHLIGHT_H"
cpp_compat = true
style = "type"
usize_is_size_t = true
header = """
/* pathlight C API. Generated by cbindgen from crates/pathlight-capi; do not edit.
 * Regenerate with: cbindgen --config crates/pathlight-capi/cbindgen.toml \\
 *   --crate pathlight-capi --output crates/pathlight-capi/include/pathlight.h */"""
documentation_style = "c99"

[export]
prefix = ""

[enum]
rename_variants = "ScreamingSnakeCase"
