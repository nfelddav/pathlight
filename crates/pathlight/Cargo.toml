[package]
name = "pathlight"
description = "Lightweight 2D path renderer: Beziers and B-splines, CSS blend modes, shaped text."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["text"]
text = ["dep:harfrust", "dep:skrifa", "dep:unicode-bidi", "dep:unicode-script"]

[dependencies]
harfrust = { version = "0.15", optional = true }
skrifa = { version = "0.49", optional = true }
unicode-bidi = { version = "0.3", optional = true }
unicode-script = { version = "0.5", optional = true }

[[example]]
name = "demo"
required-features = ["text"]
