name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test -p pathlight --no-default-features

  c-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Header is up to date
        run: |
          cargo install cbindgen --version 0.29.4 --locked
          cbindgen --config crates/pathlight-capi/cbindgen.toml --crate pathlight-capi \
            --output crates/pathlight-capi/include/pathlight.h
          git diff --exit-code crates/pathlight-capi/include/pathlight.h
      - run: cargo build --release -p pathlight-capi
      - run: make -C examples/c run

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test
        working-directory: crates/pathlight-py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install "maturin>=1.7,<2" pytest
          maturin develop
          pytest -q tests
